<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C0C0E">
<title>AEK Player Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AEK Hub">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script src="config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* AEK Player Hub v2 · "Close the three rings" concept.
   Phone: sticky top bar + scroll + 4 bottom tabs. Desktop (>=900px): left sidebar + 12-col grid.
   Dark carbon look is default (yellow pops on it); light paper look available. */
:root{
  --bg:#0C0C0E; --surface:#17171A; --surface2:#202024; --surface3:#2B2B31; --line:#2C2C33;
  --fg:#F5F4EE; --muted:#9B9B95; --accent:#FFD100; --accent-ink:#111111;
  --good:#3BD67C; --warn:#F6B73C; --bad:#F25C54;
  --r1:#FFD100; --r2:#3EE0A3; --r3:#5AAFFF;
  --shadow:0 12px 32px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.5);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",Arial,Helvetica,sans-serif;
  --r:22px; color-scheme:dark;
}
body[data-look="light"]{
  --bg:#F2F1EA; --surface:#FFFFFF; --surface2:#ECEBE3; --surface3:#DEDDD2; --line:#DAD8CC;
  --fg:#121212; --muted:#6B6B64; --good:#1E9B49; --warn:#C27C08; --bad:#D3352F;
  --r1:#E0B000; --r2:#0FA36A; --r3:#2B7FE0;
  --shadow:0 10px 30px rgba(17,17,17,.08), 0 1px 2px rgba(17,17,17,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
h1,h2,h3{margin:0;font-family:var(--display);line-height:1}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* ===== shell ===== */
.app{height:100%;display:flex;width:100%}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.mono{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:15px;flex:none;position:relative}
.who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:0;text-align:left}
.who .name{font-family:var(--display);font-weight:800;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}
.who .date{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin-top:3px}
.streak{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px 5px 8px;font-family:var(--display);font-weight:800;font-size:18px;line-height:1}
.streak small{font-family:var(--body);font-weight:600;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.streak.hot{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scroll{flex:1;overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px))}
.view{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;align-items:start}
.view>*{grid-column:span 12;min-width:0}
.tabs{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);position:relative}
.tabs button svg,.navbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--fg)}
.tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.dotn{position:absolute;top:7px;right:calc(50% - 19px);width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--surface)}

@media (min-width:900px){
  .side{display:flex;flex-direction:column;width:250px;flex:none;background:#000;color:#F5F4EE;padding:24px 18px 18px;gap:6px;height:100%;border-right:1px solid var(--line)}
  body[data-look="light"] .side{background:#121212}
  .side .brand{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-bottom:22px;padding:4px 6px 0}
  .side .brand .mono{width:46px;height:46px;font-size:16px}
  .side .brand .t{font-family:var(--display);font-weight:900;font-size:34px;line-height:.9;text-transform:uppercase;white-space:nowrap}
  .side .brand .t span{color:var(--accent)}
  .navbtn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.03em;color:#B9B8AF;position:relative;text-align:left;width:100%}
  .navbtn:hover{background:rgba(255,255,255,.06);color:#fff}
  .navbtn.on{background:var(--accent);color:var(--accent-ink)}
  .navbtn .dotn{position:static;margin-left:auto;box-shadow:none}
  .side .spacer{flex:1}
  .side .me{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:rgba(255,255,255,.06);width:100%;text-align:left}
  .side .me .n{font-family:var(--display);font-weight:700;font-size:17px;line-height:1}
  .side .me .p{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#B9B8AF;margin-top:3px}
  .side .me .sw{font-size:11px;color:var(--accent);margin-left:auto;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
  .tabs{display:none}
  .top{padding-left:28px;padding-right:28px;padding-block:16px}
  .top .mono{display:none}
  .top .who .name{font-size:30px}
  .scroll{padding:22px 28px 40px}
  .view{gap:18px}
  .c6{grid-column:span 6!important}.c4{grid-column:span 4!important}.c8{grid-column:span 8!important}.c3{grid-column:span 3!important}
}
@media (min-width:1400px){.scroll{padding-left:40px;padding-right:40px}.view{gap:22px}}

/* ===== cards ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card .head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.card h2{font-size:26px;font-weight:800;margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--surface2);border:1px solid var(--line);color:var(--fg);white-space:nowrap}
.pill.y{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill.k{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill.g{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.pill.w{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill.r{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.view.enter>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.view.enter>*:nth-child(2){animation-delay:.05s}.view.enter>*:nth-child(3){animation-delay:.1s}.view.enter>*:nth-child(4){animation-delay:.15s}.view.enter>*:nth-child(5){animation-delay:.2s}.view.enter>*:nth-child(6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:15px;font-family:var(--display);font-weight:900;font-size:20px;letter-spacing:.05em;text-transform:uppercase;margin-top:12px;transition:transform .1s;position:relative;overflow:hidden}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface2);color:var(--fg);border:1px solid var(--line)}
.btn.dark{background:var(--fg);color:var(--bg)}
.btn[disabled]{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:600}
.chip.y{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent)}
.chip.low{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.bar{height:10px;background:var(--surface2);border-radius:6px;position:relative;overflow:hidden;flex:1}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* ===== rings ===== */
.tri{position:relative;flex:none}
.tri svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.tri .tk{fill:none;stroke:var(--surface3);stroke-width:8}
.tri .pv{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.tri .pv.full{filter:drop-shadow(0 0 4px currentColor)}
.tri .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:900;line-height:1}
.tri .v small{display:block;font-family:var(--body);font-weight:700;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.ring{position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle.p{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:900;font-size:30px;line-height:1}
.ring .v small{font-size:10px;font-family:var(--body);font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.7;display:block;margin-top:2px}

/* ===== hero (mission) ===== */
.hero{padding:22px 20px 18px;background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--accent) 22%,var(--surface)) 0%,var(--surface) 55%)}
.hero::after{content:"AEK";position:absolute;right:10px;bottom:-26px;font-family:var(--display);font-weight:900;font-size:130px;letter-spacing:-.02em;opacity:.05;pointer-events:none}
.hero .row{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;position:relative}
.hero .big{font-family:var(--display);font-weight:900;font-size:44px;line-height:.92;margin-top:6px}
.hero .sub{margin-top:10px;font-size:14.5px;color:var(--muted);max-width:48ch}
.hero .tri{width:132px;height:132px}
.hero .tri .v{font-size:36px}
.goals{display:flex;flex-direction:column;gap:6px;margin-top:16px;position:relative}
.goal{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left;width:100%;transition:transform .12s,border-color .2s}
.goal:active{transform:scale(.99)}
.goal .dot{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.goal .t{font-weight:700;font-size:16px;line-height:1.1}
.goal .t small{display:block;color:var(--muted);font-weight:500;font-size:12.5px;margin-top:2px}
.goal .p{font-family:var(--display);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums;color:var(--c)}
.goal .p small{font-family:var(--body);font-size:11px;font-weight:700;color:var(--muted);margin-left:2px}
.goal .chev{color:var(--muted);font-family:var(--display);font-size:22px;font-weight:900}
.goal.done{border-color:color-mix(in srgb,var(--c) 50%,transparent)}
.goal.done .chev{color:var(--c)}
.perfect{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--fg);color:var(--bg);border-radius:14px;padding:12px 14px;font-weight:700;position:relative}
.perfect.yes{background:var(--accent);color:var(--accent-ink)}
.perfect b{font-family:var(--display);font-size:20px;font-weight:900}
.perfect span{font-size:13px;opacity:.8;font-weight:600}
@media (max-width:420px){.hero .big{font-size:38px}.hero .tri{width:112px;height:112px}.hero .tri .v{font-size:30px}}

/* last 7 days strip */
.strip{display:flex;align-items:center;gap:6px;justify-content:space-between}
.strip .dy{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;min-width:0}
.strip .dy .tri{width:44px;height:44px}
.strip .dy .tri .tk,.strip .dy .tri .pv{stroke-width:11}
.strip .dy span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.strip .dy.today span{color:var(--fg)}
.strip .dy .st{font-size:12px}
.strip .dy.perfect-day span{color:var(--accent)}
@media (min-width:600px){.strip .dy .tri{width:56px;height:56px}}

/* focus / coach */
.focus{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.focus .ic{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:20px;flex:none}
.focus .q{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.05}
.focus .from{color:var(--muted);font-size:12.5px;margin-top:6px}
.ack{display:inline-flex;align-items:center;gap:8px;margin-top:12px;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 14px;font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.04em}
.ack.on{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);border:1px solid color-mix(in srgb,var(--good) 40%,transparent)}
.team{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.team .l{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:13px}
.team .l b{font-family:var(--display);font-size:18px;font-weight:800}
.avs{display:flex;margin-top:8px}
.avs i{width:22px;height:22px;border-radius:50%;background:var(--surface3);border:2px solid var(--surface);margin-left:-6px;font-style:normal;font-size:8px;font-weight:800;display:grid;place-items:center;font-family:var(--display)}
.avs i:first-child{margin-left:0}
.avs i.y{background:var(--accent);color:var(--accent-ink)}

/* next match strip */
.nm{display:flex;align-items:center;gap:14px;padding:14px 18px}
.nm .vs{font-family:var(--display);font-weight:900;font-size:22px;line-height:1;flex:1;min-width:0}
.nm .vs small{display:block;font-family:var(--body);font-weight:600;font-size:12px;color:var(--muted);margin-top:3px}
.cd{display:flex;gap:4px}
.cd div{background:var(--surface2);border-radius:10px;padding:7px 8px 5px;text-align:center;min-width:46px}
.cd b{font-family:var(--display);font-weight:900;font-size:22px;line-height:1;font-variant-numeric:tabular-nums;display:block}
.cd span{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* ===== timeline steps ===== */
.steps{display:flex;flex-direction:column;gap:12px}
.step{position:relative;padding-left:0}
.step .shead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.step .time{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;background:var(--surface2);padding:8px 10px;border-radius:12px;min-width:74px;text-align:center;flex:none;border:2px solid transparent}
.step .time small{display:block;font-family:var(--body);font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.step.now .time{background:var(--accent);color:var(--accent-ink)}
.step.now .time small{color:rgba(0,0,0,.6)}
.step.past .time{border-color:var(--good)}
.step .shead h2{font-size:24px}
.step .shead .eyebrow{margin-bottom:2px}
.step .shead .pill{margin-left:auto}
.stepnum{position:absolute;right:14px;top:12px;font-family:var(--display);font-weight:900;font-size:60px;opacity:.06;line-height:1;pointer-events:none}

/* activation / mobility checklist */
.check{display:flex;flex-direction:column;gap:8px}
.check button{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%;transition:all .15s}
.check button .bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;font-weight:900;color:var(--accent-ink);font-size:14px;transition:all .15s}
.check button.on{border-color:var(--r2)}
.check button.on .bx{background:var(--r2);border-color:var(--r2)}
.check button .t{font-weight:700;font-size:15.5px;line-height:1.1}
.check button .t small{display:block;color:var(--muted);font-weight:500;font-size:12.5px;margin-top:2px}
.check button.on .t{text-decoration:line-through;text-decoration-color:var(--muted);text-decoration-thickness:1px;opacity:.75}
.check button .d{font-family:var(--display);font-weight:800;font-size:16px;color:var(--muted)}

/* gauges (pitch) */
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gauge{background:var(--surface2);border-radius:16px;padding:12px 8px 10px;text-align:center;min-width:0}
.gauge svg{width:100%;max-width:110px;height:auto;display:block;margin:0 auto}
.gauge path.track{stroke:var(--surface3);fill:none;stroke-width:10;stroke-linecap:round}
.gauge path.val{stroke:var(--r2);fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.gauge.hit path.val{stroke:var(--good)}
.gauge.miss path.val{stroke:var(--warn)}
.gauge .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.gauge .v{font-family:var(--display);font-weight:900;font-size:22px;line-height:1;margin-top:-22px;font-variant-numeric:tabular-nums}
@media (max-width:420px){.gauge .v{font-size:19px;margin-top:-20px}.gauge .pc{font-size:12px}}
.gauge .v small{font-family:var(--body);font-size:11px;color:var(--muted);font-weight:600;margin-left:2px}
.gauge .pc{font-family:var(--display);font-weight:700;font-size:14px;color:var(--muted);margin-top:4px}
.speedrule{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-top:12px;background:var(--surface2);border-radius:14px;padding:12px 14px}
.speedrule .b{font-family:var(--display);font-weight:900;font-size:34px;line-height:1}
.speedrule .b small{font-family:var(--body);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:block;color:var(--muted)}
.speedrule p{margin:0;font-size:13.5px}
.speedrule.g .b{color:var(--good)}.speedrule.w .b{color:var(--accent)}
.sbar{height:8px;border-radius:5px;background:linear-gradient(90deg,var(--good) 0 60%,var(--warn) 60% 85%,var(--bad) 85%);position:relative;margin-top:8px}

.trow .trd{grid-area:ready;text-align:center;min-width:44px}
.trow .trd b{font-family:var(--display);font-weight:900;font-size:22px;line-height:1;display:block;font-variant-numeric:tabular-nums}
.trow .trd small{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.trow .trg{grid-area:rings}

.trow .tmeta{grid-area:meta;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.trow .tmeta b{color:var(--fg);font-family:var(--display);font-size:14px}
.trow .tmeta .ok{color:var(--good);font-weight:700}
.trow .tmeta .no{color:var(--bad);font-weight:700}
.trow .chev{grid-area:chev;color:var(--muted);font-family:var(--display);font-size:22px;font-weight:900;text-align:right}
.tr7{display:inline-flex;gap:3px;vertical-align:middle}
.tr7 i{width:11px;height:11px;border-radius:3px;background:var(--surface3);display:block}
.tr7 i.p{background:var(--good)}.tr7 i.h{background:var(--warn)}.tr7 i.m{background:var(--bad)}
.tr7 i.t{outline:2px solid var(--fg);outline-offset:1px}

.scale button.on .n{color:var(--fg)}

.wxcard{padding:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--wxc) 24%,var(--surface)) 0%,var(--surface) 72%);border-color:color-mix(in srgb,var(--wxc) 45%,var(--line))}

/* ===== morning reminder (push) card (04.11.2026) ===== */
.pushcard{display:flex;align-items:center;gap:14px;padding:14px 16px}
.pushcard .ic{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--accent) 18%,var(--surface2));color:var(--accent);display:grid;place-items:center;flex:none}

.sync{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none;opacity:.55;display:none}

.noplan{text-align:center;padding:26px 18px}
.noplan .big{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;margin-top:8px}

.spv{font-size:10px;font-weight:700;fill:var(--fg)!important;font-variant-numeric:tabular-nums}

/* Every roster player is built from the four detailed demo profiles (sketch data, same numbers on every reload). */
function buildPlayer(r,i){
  const photo=r.photo===false?null:r.id;
  const det=DETAILED.find(d=>d.id===r.id);
  if(det){return Object.assign(det,{name:r.name,short:r.short,av:r.av,pos:r.pos,photo,gk:false})}
  const s=k=>seeded(i,60+k,3);
  const mins=r.gk?0:(s(1)<0.5?Math.round(60+s(2)*30):Math.round(s(3)*30));
  const t=mins>=60?DETAILED[0]:(s(4)<0.5?DETAILED[1]:DETAILED[3]);
  const p=JSON.parse(JSON.stringify(t));
  Object.assign(p,{id:r.id,name:r.name,short:r.short,av:r.av,pos:r.pos,photo,gk:!!r.gk,lastMin:mins});
  if(mins>=60)p.sub=`You played ${mins} minutes yesterday. Gym only today, no pitch. Protect the legs for Wednesday.`;
  else if(t===DETAILED[3]&&mins>0)p.sub=`Only ${mins} minutes yesterday. Full pitch session today plus one top speed exposure.`;
  const k=0.9+s(5)*0.2;
  p.ref={td:Math.round(t.ref.td*k),hsr:Math.round(t.ref.hsr*k),spr:Math.round(t.ref.spr*k),vmax:+(31.5+s(6)*3.5).toFixed(1)};
  if(p.pitch){p.pitch.td=Math.round(t.pitch.td*k);p.pitch.hsr=Math.round(t.pitch.hsr*k);p.pitch.spr=Math.round(t.pitch.spr*k);
    p.result={td:Math.round(p.pitch.td*(0.84+s(10)*0.28)),hsr:Math.round(p.pitch.hsr*(0.8+s(11)*0.35)),spr:Math.round(p.pitch.spr*(0.8+s(12)*0.4)),vmax:+(p.ref.vmax*(p.pitch.capPct?0.84+s(13)*0.1:0.92+s(13)*0.07)).toFixed(1)}}
  p.speedDays=Math.round(1+s(7)*13);p.lastSpeed=+(p.ref.vmax-(0.5+s(8)*3)).toFixed(1);
  p.pb={hsr:Math.round(p.ref.hsr*1.12),spr:Math.round(p.ref.spr*1.25)};
  p.readiness=[0,1,2,3,4,5].map(j=>Math.round(58+seeded(i,70+j,1)*34)).concat([0]);
  p.total=Math.round(25+s(9)*25);p.trend=t.trend.map((v,j)=>+(v*(0.85+seeded(i,80+j,1)*0.3)).toFixed(1));
  p.hist=PAST.map((d,j)=>{const a=seeded(i,90+j,1),b=seeded(i,96+j,1),c=seeded(i,102+j,1);if(d.t==="MATCH")return [a<0.08?0:100,100,null];return [a<0.12?0:100,b<0.15?Math.round(50+b*300):100,c<0.3?Math.round(45+c*150):100]});
  if(r.gk){p.modeLabel="Goalkeeper day";p.dayType="MD+1 · GK session 11:00";p.sub="Goalkeeper session with the GK coach, then gym. Hands, hips, clean landings.";p.pitch=null;p.result=null;
    p.focus="Hands and hips. Every landing clean in the gym.";
    p.mobility=[{n:"GK warm-up",d:"20 min",note:"with the GK coach"},{n:"Shoulder and hip mobility",d:"8 min",note:"individual"},{n:"Bike flush",d:"10 min",note:"easy, under 120 bpm"}];
    p.activation={time:"10:30",group:"GK activation with the GK coach",indiv:["Shoulder mobility 5 min"]}}
  return p;
}

/* ---------- the three rings ---------- */
function allExercises(pl){pl=pl||P;return pl.gym.slots.flatMap(s=>s.ex.map((e,i)=>({...e,id:s.s+i,slot:s.s,sets:parseInt(e.d)}))).concat((pl.gym.extras||[]).map((e,i)=>({...e,id:"X"+i,slot:"X",sets:parseInt(e.d)})))}
function pitchPct(t,r){return Math.min(100,Math.round(r/t*100))}
function ringsOf(pl,stOv){pl=pl||P;
  const st=stOv||pstate(pl); const c=st.checkins[TK]||null;
  const ci=c?100:0;
  let sess=0, sessLabel="", sessSub="";
  if(pl.pitch){
    if(LIVE?!!pl.result:(demoAfter&&pl.result)){const t=pl.pitch,r=pl.result;const raw=[r.td/t.td,r.hsr/t.hsr,r.spr/t.spr];const ps=raw.map(x=>Math.min(1,x/0.9));sess=Math.round(ps.reduce((a,b)=>a+b,0)/3*100);const hit=raw.filter(x=>x>=0.9).length;sessLabel=hit+"/3";sessSub=hit===3?"All targets hit":hit+" of 3 targets hit"}
    else{sess=0;sessLabel="0/3";sessSub="GPS result arrives after training"}
  }else{
    const m=st.mob[TK]||{};if(!pl.mobility||!pl.mobility.length){sess=100;sessLabel="—";sessSub="No session planned today"}else{const n=pl.mobility.length,d=pl.mobility.filter((x,i)=>m[i]).length;sess=Math.round(d/n*100);sessLabel=d+"/"+n;sessSub=d===n?"Activation and mobility done":"Tick off activation and mobility"}
  }
  const ex=allExercises(pl);const gs=st.gym[TK]||{};const total=ex.reduce((a,e)=>a+e.sets,0),done=ex.reduce((a,e)=>a+Math.min(e.sets,gs[e.id]||0),0);
  const gym=total?Math.round(done/total*100):100;
  const vals=[ci,sess,gym];const score=Math.round(vals.reduce((a,b)=>a+b,0)/3);const closed=vals.every(v=>v>=100);
  return {vals,score,closed,ci,sess,gym,sessLabel,sessSub,gymDone:done,gymTotal:total,c};
}
function perfectDay(v){return v.every(x=>x==null||x>=100)}
function streak(pl){pl=pl||P;const r=ringsOf(pl);let n=r.closed?1:0;for(let i=pl.hist.length-1;i>=0;i--){if(perfectDay(pl.hist[i]))n++;else break}return n}
function triple(v,size,center,strokeCls){const R=[42,32,22];let s=`<div class="tri" style="width:${size}px;height:${size}px"><svg viewBox="0 0 100 100">`;R.forEach((r,i)=>{const c=2*Math.PI*r;const p=v[i]==null?0:Math.min(100,v[i])/100;s+=`<circle class="tk" cx="50" cy="50" r="${r}"${v[i]==null?' stroke-dasharray="1.5 4"':''}/><circle class="pv ${p>=1?"full":""}" style="color:${RING_C[i]}" stroke="${RING_C[i]}" cx="50" cy="50" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${c*(1-p)}"/>`});s+=`</svg><div class="v">${center||""}</div></div>`;return s}
function ring(pct,color,size,label,track,shown){const r=40,c=2*Math.PI*r;return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="${track||"var(--surface3)"}" stroke-width="9"/><circle class="p" cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${c*(1-pct/100)}"/></svg><div class="v"><span data-count="${shown==null?pct:shown}">0</span><small>${label}</small></div></div>`}
function animateRings(root){requestAnimationFrame(()=>{root.querySelectorAll("circle[data-off]").forEach(c=>c.setAttribute("stroke-dashoffset",c.dataset.off));root.querySelectorAll("path.val[data-off]").forEach(c=>c.setAttribute("stroke-dashoffset",c.dataset.off));root.querySelectorAll("[data-count]:not([data-dec])").forEach(e=>countUp(e,+e.dataset.count,900,v=>fmt(Math.round(v))))})}
function gauge(label,val,unit,pct,sub,cls){const R=44,cx=55,cy=55,a0=Math.PI*0.75,a1=Math.PI*2.25;const arc=(t)=>{const a=a0+(a1-a0)*t;return [cx+R*Math.cos(a),cy+R*Math.sin(a)]};const [x0,y0]=arc(0),[x1,y1]=arc(1);const d=`M${x0} ${y0} A${R} ${R} 0 1 1 ${x1} ${y1}`;const L=R*(a1-a0);const p=Math.min(1,pct/100);return `<div class="gauge ${cls||""}"><svg viewBox="0 0 110 92"><path class="track" d="${d}"/><path class="val" d="${d}" stroke-dasharray="${L}" stroke-dashoffset="${L}" data-off="${L*(1-p)}"/></svg><div class="v"><span data-count="${val}">0</span><small>${unit}</small></div><div class="k">${label}</div><div class="pc">${sub}</div></div>`}

/* ---------- LIVE HISTORY: last 14 days from the hub (plan + GPS result + the day's state) feed Progress and the 7-day strip ---------- */
const WD=d=>d.toLocaleDateString("en-GB",{weekday:"short"});
function dayDate(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function histDay(day){const pl=day.plan;if(!pl)return null;

function applyHistory(p,days){if(!days||!days.length)return;

  p.liveHist=last6.map(x=>({d:WD(x.date),n:x.date.getDate(),t:x.h&&x.h.match?"MATCH":"",v:x.h?x.h.vals:[null,null,null]}));

  const pitchDays=H.filter(x=>x.d.plan&&x.d.plan.pitch&&x.d.plan.pitch.td&&x.d.result).slice(-5);
  const gymDays=H.filter(x=>x.h&&x.h.gTot).slice(-5);
  p.liveDone={pitch:{td:[],hsr:[],spr:[]},gym:gymDays.map(x=>({plan:x.h.gTot,done:x.h.gDone})),labels:pitchDays.map(lab),gymLabels:gymDays.map(lab)};

  el.innerHTML=`<div class="card"><div class="head"><div><div class="eyebrow">Today</div><h2>Your rings</h2></div><span class="pill ${R.closed?"y":""}">${R.closed?"Perfect day":R.score+" day score"}</span></div><div class="strip" style="justify-content:flex-start;gap:16px">${triple(R.vals,72,`<span style="font-size:20px">${R.score}</span>`)}<div><div style="font-weight:700">${R.closed?"All three rings closed.":"Close all three rings to make today a perfect day."}</div><div class="muted small" style="margin-top:4px">${c?"Readiness "+rNow+" · "+readyWord(rNow):"No check-in yet today."}</div></div></div><div class="legend" style="margin-top:12px"><span><i style="background:var(--r1)"></i>Check-in</span><span><i style="background:var(--r2)"></i>Session</span><span><i style="background:var(--r3)"></i>Gym</span></div></div>
  <div class="card c6"><div class="head"><div><div class="eyebrow">History</div><h2>Builds up day by day</h2></div></div><div class="muted" style="line-height:1.5">The hub started collecting your days now. Your 7-day rings, readiness trend and done-vs-plan charts appear here as the days come in.</div></div>
  <div class="card c6"><div class="head"><div><div class="eyebrow">Your reference</div><h2>Match numbers</h2></div></div><div class="kpis"><div class="kpi y"><div class="k">Top speed</div><div class="v">${P.ref.vmax?P.ref.vmax.toFixed(1):"—"}<small>km/h</small></div></div><div class="kpi"><div class="k">Match distance</div><div class="v">${P.ref.td?(P.ref.td/1000).toFixed(1):"—"}<small>km</small></div></div><div class="kpi"><div class="k">High speed</div><div class="v">${P.ref.hsr?fmt(P.ref.hsr):"—"}<small>m</small></div></div><div class="kpi"><div class="k">Sprint</div><div class="v">${P.ref.spr?fmt(P.ref.spr):"—"}<small>m</small></div></div></div><div class="muted small" style="margin-top:10px">Your pitch targets each day are a share of these numbers.${P.speedDays!=null?" Last top speed exposure: "+P.speedDays+" day"+(P.speedDays===1?"":"s")+" ago.":""}</div></div>`;
  animateRings(el)}

/* ---------- WEEK ---------- */
function renderWeek(){
  const R=ringsOf();
  if(LIVE){document.getElementById("v-week").innerHTML=`<div class="card"><div class="head"><div><div class="eyebrow">Week</div><h2>${TODAY.toLocaleDateString("en-GB",{weekday:"long",day:"2-digit",month:"long"})}</h2></div><span class="pill y">${P.dayType||"today"}</span></div><div class="muted" style="line-height:1.5">The staff publishes your days one at a time for now. The full week view with match days arrives in the next version of the hub.</div></div>`;return}
  const h=`<div class="card"><div class="head"><div><div class="eyebrow">Week 18</div><h2>02 to 08 November</h2></div><span class="pill y">2 matches · 5 days</span></div><div class="days">${WEEK.map(d=>{const today=+d.n===TODAY.getDate();return `<div class="dayc ${d.cls} ${today?"today":""}">${today?triple(R.vals,34,""):""}<div class="d">${d.d}<b>${d.n}</b></div><span class="pill ${d.cls==="match"?"y":""}">${d.pill}</span><div class="t">${d.t}</div><div class="s">${d.s}</div></div>`}).join("")}</div></div>
  <div class="card c6"><div class="head"><div><div class="eyebrow">This week</div><h2>Two games in five days</h2></div></div><div class="muted" style="line-height:1.5">Sleep, food and the morning check-in matter more this week than any single gym session. If you play Wednesday, Thursday is full recovery and Friday brings one speed exposure before Sunday.</div></div>
  <div class="card c6"><div class="head"><div><div class="eyebrow">How your week is built</div><h2>Your pattern</h2></div></div><div class="chips"><span class="chip y">MD+1 · recover or compensate</span><span class="chip">MD-2 · speed and power</span><span class="chip">MD-1 · short and sharp</span><span class="chip">MATCH · everything</span></div><div class="muted" style="font-size:13.5px;margin-top:12px">Your pitch targets each day are a share of your own match numbers, so the plan is yours, not the team average. On a match day the gym ring is not planned, so check-in plus the match close the day.</div></div>`;
  const el=document.getElementById("v-week");el.innerHTML=h;animateRings(el);
}


/* ---------- STAFF MODE: team table, then open any player ---------- */
let teamFilter="all", teamSort="name";
function setAv(id,p){const el=document.getElementById(id);el.classList.remove("crestav");el.classList.toggle("photo",!!p.photo);el.innerHTML=p.photo?`<img src="photos/${p.photo}.webp" alt="">`:p.av}
function staffHeader(){document.getElementById("h-name").textContent="Performance staff";document.getElementById("h-date").textContent=TODAY.toLocaleDateString("en-GB",{weekday:"short",day:"2-digit",month:"short"})+" · tap to switch";
  const av=document.getElementById("h-av");av.classList.remove("photo");av.classList.add("crestav");av.innerHTML=`<img src="crest.webp" alt="">`;
  const sv=document.getElementById("s-av");sv.classList.remove("photo");sv.classList.add("crestav");sv.innerHTML=`<img src="crest.webp" alt="">`;
  document.getElementById("s-name").textContent="Staff";document.getElementById("s-pos").textContent="Performance";document.getElementById("h-streakwrap").classList.add("hidden")}
function enterStaff(){P=null;draft=null;TEAMDATA=null;document.body.dataset.staff="1";document.body.dataset.noplayer="1";save("last","__staff");
  document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("staffbar").classList.add("hidden");staffHeader();show("team")}
function leaveStaff(){delete document.body.dataset.staff;delete document.body.dataset.noplayer;document.getElementById("staffbar").classList.add("hidden");document.getElementById("h-streakwrap").classList.remove("hidden")}
function hasLocalToday(st){if(st.seeded===TK)return false;return !!(st.checkins[TK]||(st.gym[TK]&&Object.keys(st.gym[TK]).length)||(st.mob[TK]&&Object.keys(st.mob[TK]).length)||st.ack[TK])}
/* Demo row: what the table would show if this player used the app today (sketch, deterministic). */
function demoCheckin(i,sore,at){const q=k=>seeded(i,110+k,TODAY.getDate());const sc=k=>Math.max(1,Math.min(5,Math.round(1.6+q(k)*3.6)));return {hours:+(5.5+q(0)*3).toFixed(1),sleepq:sc(1),fatigue:sc(2),soreness:sore.length?2:sc(3),stress:sc(4),mood:sc(5),zones:sore,note:"",at}}
function demoRow(p,i){const s=k=>seeded(i,40+k,TODAY.getDate());const opened=s(1)<0.9;const ci=opened&&s(2)<0.84;
  const at=`0${7+Math.floor(s(4)*2)}:${String(Math.floor(s(5)*60)).padStart(2,"0")}`;const ack=ci&&s(6)<0.72;const sore=ci&&s(10)<0.2?["L hamstring"]:[];const dci=ci?demoCheckin(i,sore,at):null;const ready=dci?readinessOf(dci):null;
  let sess;if(p.pitch){sess=demoAfter?ringsOf(p).sess:0}else{const n=p.mobility.length;const k=s(7)<0.8?n:Math.floor(s(7)*n);sess=demoAfter?Math.round(k/n*100):0}
  const gymPct=demoAfter?(s(8)<0.65?100:Math.round(40+s(8)*55)):0;
  const ex=allExercises(p);const gymTotal=ex.reduce((a,e)=>a+e.sets,0);const gymDone=Math.round(gymTotal*gymPct/100);
  return {p,i,opened,ci,ready,dci,at:ci?at:null,ack,vals:[ci?100:0,sess,gymTotal?Math.round(gymDone/gymTotal*100):100],gymDone,gymTotal,
    lastOpen:opened&&!ci?`0${8+Math.floor(s(9)*2)}:${String(Math.floor(s(5)*60)).padStart(2,"0")}`:null,sore,local:false}}
function localRow(p,i){const st=pstate(p);const R=ringsOf(p);const c=st.checkins[TK];
  return {p,i,opened:true,ci:!!c,ready:c?readinessOf(c):null,at:c?c.at:null,ack:!!st.ack[TK],vals:R.vals,gymDone:R.gymDone,gymTotal:R.gymTotal,lastOpen:"today",sore:c?(c.zones||[]):[],local:true}}
function teamRows(){if(LIVE)return liveRows();return PLAYERS.map((p,i)=>hasLocalToday(pstate(p))?localRow(p,i):demoRow(p,i)).map(r=>{r.closed=r.vals.every(v=>v>=100);r.att=!r.ci||(r.ready!=null&&r.ready<55)||r.sore.length>0;return r})}
/* Opening a demo player writes the same demo state on this device, so the player's own screens match the table row. */
function seedDemo(r){const st={checkins:{},gym:{},mob:{},ack:{},seeded:TK};
  if(r.dci)st.checkins[TK]={...r.dci,zones:[...r.dci.zones]};
  if(r.ack)st.ack[TK]=true;
  if(!r.p.pitch&&r.vals[1]>0){st.mob[TK]={};const d=Math.round(r.p.mobility.length*r.vals[1]/100);for(let k=0;k<d;k++)st.mob[TK][k]=true}
  if(r.gymDone>0){st.gym[TK]={};let left=r.gymDone;allExercises(r.p).forEach(e=>{const k=Math.min(e.sets,left);if(k>0)st.gym[TK][e.id]=k;left-=k})}
  save("p:"+r.p.id,st)}
function openPlayer(id){const i=PLAYERS.findIndex(p=>p.id===id);const p=PLAYERS[i];if(LIVE)adoptLive(p);else if(!hasLocalToday(pstate(p)))seedDemo(demoRow(p,i));
  P=p;draft=null;delete document.body.dataset.noplayer;document.getElementById("staffbar").classList.remove("hidden");document.getElementById("sb-name").textContent=p.name;
  document.getElementById("h-streakwrap").classList.remove("hidden");view="today";renderAll()}
document.getElementById("sb-back").onclick=()=>{clearTimers();P=null;draft=null;document.body.dataset.noplayer="1";document.getElementById("staffbar").classList.add("hidden");staffHeader();show("team")};
function tr7(r){const cells=r.p.hist.map(v=>perfectDay(v)?"p":v.some(x=>x===0)?"m":"h");const today=r.closed?"p":!r.opened?"m":"h";
  return `<span class="tr7">${cells.map(c=>`<i class="${c}"></i>`).join("")}<i class="${today} t"></i></span>`}
function renderTeam(){
  const el=document.getElementById("v-team");if(LIVE&&(!TEAMDATA||(TEAMDATA.at&&Date.now()-TEAMDATA.at>120000))){el.innerHTML=`<div class="card"><div class="eyebrow">Team</div><h2 style="margin-top:6px">Loading today's rows…</h2><div class="muted small" style="margin-top:8px">Fetching every player's check-in and session from the hub.</div></div>`;loadTeam();return}const rows=teamRows();
  const nCI=rows.filter(r=>r.ci).length,nOpen=rows.filter(r=>r.opened).length,nPerf=rows.filter(r=>r.closed).length,nAtt=rows.filter(r=>r.att).length;
  const rd=rows.filter(r=>r.ready!=null);const avgR=rd.length?Math.round(rd.reduce((a,r)=>a+r.ready,0)/rd.length):null;
  const nGym=rows.filter(r=>r.vals[2]>=100).length,nAck=rows.filter(r=>r.ack).length;
  const filters=[["all","All",rows.length],["att","Needs attention",nAtt],["noci","No check-in",rows.length-nCI],["low","Low readiness",rows.filter(r=>r.ready!=null&&r.ready<55).length],["sore","Sore",rows.filter(r=>r.sore.length).length],["gym","Gym not done",rows.length-nGym],["perf","Perfect day",nPerf]];
  const list=rows.filter(r=>teamFilter==="all"||(teamFilter==="att"&&r.att)||(teamFilter==="noci"&&!r.ci)||(teamFilter==="low"&&r.ready!=null&&r.ready<55)||(teamFilter==="sore"&&r.sore.length)||(teamFilter==="gym"&&r.vals[2]<100)||(teamFilter==="perf"&&r.closed));
  const score=r=>Math.round(r.vals.reduce((a,b)=>a+b,0)/3);
  if(teamSort==="ready")list.sort((a,b)=>(a.ready??-1)-(b.ready??-1));else if(teamSort==="score")list.sort((a,b)=>score(a)-score(b));else if(teamSort==="att")list.sort((a,b)=>(b.att?1:0)-(a.att?1:0));
  const dateL=TODAY.toLocaleDateString("en-GB",{weekday:"long",day:"2-digit",month:"long"});
  let h=`<div class="card hero"><div class="teamhero"><img class="crest" src="crest.webp" alt=""><div><div class="eyebrow">${dateL} · ${demoAfter?"after the session":"this morning"}</div><div class="big" style="font-size:38px">Team today</div><div class="sub">Tap a player to open their own screens. A red border means a word before training.</div></div></div>
  <div class="teamkpi" style="margin-top:16px"><div class="kpi ${nCI===rows.length?"y":""}"><div class="k">Check-ins</div><div class="v"><span data-count="${nCI}">0</span><small>/ ${rows.length}</small></div></div><div class="kpi"><div class="k">Avg readiness</div><div class="v" style="color:${avgR==null?"var(--muted)":readyColor(avgR)}">${avgR==null?"—":`<span data-count="${avgR}">0</span>`}</div></div><div class="kpi"><div class="k">Opened the app</div><div class="v"><span data-count="${nOpen}">0</span><small>/ ${rows.length}</small></div></div><div class="kpi"><div class="k">Needs attention</div><div class="v" style="${nAtt?"color:var(--bad)":""}"><span data-count="${nAtt}">0</span></div></div></div>
  <div class="legend" style="margin-top:12px"><span><b style="color:var(--fg)">${nAck}</b>&nbsp;read the focus</span><span><b style="color:var(--fg)">${nGym}</b>&nbsp;gym complete</span><span><b style="color:var(--fg)">${nPerf}</b>&nbsp;perfect days so far</span></div></div>`;
  h+=`<div class="card"><div class="head"><div><div class="eyebrow">Players</div><h2>${list.length} of ${rows.length}</h2></div><div class="sortrow"><label class="eyebrow" for="tsort">Sort</label><select id="tsort"><option value="name" ${teamSort==="name"?"selected":""}>Roster</option><option value="att" ${teamSort==="att"?"selected":""}>Attention first</option><option value="ready" ${teamSort==="ready"?"selected":""}>Readiness, low first</option><option value="score" ${teamSort==="score"?"selected":""}>Day score, low first</option></select></div></div>
  <div class="fchips">${filters.map(f=>`<button data-f="${f[0]}" class="${teamFilter===f[0]?"on":""}">${f[1]}<b>${f[2]}</b></button>`).join("")}</div>
  <div class="thead"><span></span><span>Player</span><span>Ready</span><span>Rings</span><span>Gym</span><span>Focus</span><span>Last 7 days</span><span></span></div>
  <div class="tlist">${list.map(r=>`<button class="trow ${r.att?"att":r.closed?"perf":""}" data-open="${r.p.id}"><span class="tav">${r.p.photo?`<img src="photos/${r.p.photo}.webp" alt="" loading="lazy">`:r.p.av}</span><span class="tn"><b>${r.p.short}</b><small>${r.p.gk?"Goalkeeper":r.p.pos} · ${r.opened?(r.ci?"check-in "+r.at:"opened "+r.lastOpen+", no check-in"):"not opened today"}${r.sore.length?" · sore: "+r.sore.join(", "):""}</small></span><span class="trd"><b style="color:${r.ready==null?"var(--muted)":readyColor(r.ready)}">${r.ready==null?"—":r.ready}</b><small>${r.ready==null?"no data":readyWord(r.ready)}</small></span><span class="trg">${triple(r.vals,38,"")}</span><span class="tmeta"><span class="tg"><span class="lbl">Gym </span><b>${r.gymDone}/${r.gymTotal}</b> sets</span><span class="ta"><span class="lbl">Focus </span>${r.ack?`<span class="ok">read</span>`:`<span class="${r.ci?"no":""}">${r.ci?"not read":"—"}</span>`}</span><span class="tt">${tr7(r)}<b style="margin-left:6px">${r.p.hist.filter(perfectDay).length+(r.closed?1:0)}/7</b></span></span><span class="chev">›</span></button>`).join("")}</div>
  <div class="legend" style="margin-top:12px"><span><i style="background:var(--good)"></i>Perfect day</span><span><i style="background:var(--warn)"></i>Partly done</span><span><i style="background:var(--bad)"></i>Something missed</span><span><i style="outline:2px solid var(--fg);outline-offset:1px;background:var(--surface3)"></i>Today</span></div>
  <div class="muted small" style="margin-top:10px">${LIVE?`Live rows from the players' phones · updated ${TEAMDATA&&TEAMDATA.at?new Date(TEAMDATA.at).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}):"—"} · <button class="refresh" id="teamrefresh">Refresh</button>`:"Sketch: rows come from this device plus demo data. Once the app is connected, every row comes live from the players' phones."}</div></div>`;
  el.innerHTML=h;
  el.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{teamFilter=b.dataset.f;renderTeam()});
  document.getElementById("tsort").onchange=e=>{teamSort=e.target.value;renderTeam()};
  el.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openPlayer(b.dataset.open));const tr=document.getElementById("teamrefresh");if(tr)tr.onclick=()=>{TEAMDATA=null;renderTeam()};
  animateRings(el);
}

/* ---------- confetti ---------- */
function confetti(){const cv=document.getElementById("conf");if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const ctx=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;const cols=["#FFD100","#3EE0A3","#5AAFFF","#FFFFFF"];const ps=Array.from({length:130},()=>({x:innerWidth/2,y:innerHeight*0.55,vx:(Math.random()-0.5)*16,vy:-Math.random()*15-5,s:5+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*Math.PI}));let t=0;const f=()=>{ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.45;p.vx*=0.985;p.r+=0.12;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);ctx.restore()});if(++t<85)requestAnimationFrame(f);else ctx.clearRect(0,0,cv.width,cv.height)};f()}
</script>
